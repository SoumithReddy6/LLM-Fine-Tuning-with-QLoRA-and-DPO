[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qlora-dpo-finance"
version = "0.1.0"
description = "QLoRA and DPO fine-tuning framework for financial sentiment LLMs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Soumith Reddy Padigapati" }]
dependencies = [
  "numpy>=1.26.0",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
train = [
  "accelerate>=0.34.0",
  "bitsandbytes>=0.43.3",
  "datasets>=2.21.0",
  "evaluate>=0.4.2",
  "huggingface-hub>=0.24.0",
  "mlflow>=2.15.0",
  "openai>=1.50.0",
  "peft>=0.12.0",
  "scikit-learn>=1.5.0",
  "torch>=2.3.0",
  "transformers>=4.44.0",
  "trl>=0.10.0",
  "wandb>=0.17.0",
]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
