<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">QLoRA DPO training dashboard preview</title>
  <desc id="desc">A stylized experiment dashboard showing QLoRA, DPO, benchmark lift, calibration, and hallucination metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10231c"/>
      <stop offset="50%" stop-color="#213326"/>
      <stop offset="100%" stop-color="#343018"/>
    </linearGradient>
    <style>
      .sans { font-family: "Avenir Next", "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", "Consolas", monospace; }
      .title { font-size: 46px; font-weight: 800; fill: #f3ead7; }
      .label { font-size: 20px; fill: #7e897f; }
      .value { font-size: 34px; font-weight: 700; fill: #18211c; }
      .small { font-size: 22px; fill: #304038; }
      .line { stroke: #a7b491; stroke-width: 5; fill: none; stroke-linecap: round; }
      .axis { stroke: #c7bea5; stroke-width: 2; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <rect x="72" y="64" width="1136" height="632" rx="26" fill="#f5eedf" filter="url(#shadow)"/>
  <text x="112" y="136" class="sans title">QLoRA + DPO Financial Sentiment Lab</text>
  <text x="112" y="176" class="mono small">Llama-3-8B-Instruct | Qwen2.5-7B-Instruct | 4-bit NF4 | LoRA rank 16</text>

  <rect x="112" y="220" width="230" height="118" rx="8" fill="#dce9d3"/>
  <text x="138" y="262" class="sans label">Baseline Lift</text>
  <text x="138" y="310" class="sans value">+20% target</text>

  <rect x="374" y="220" width="230" height="118" rx="8" fill="#e9dfc7"/>
  <text x="400" y="262" class="sans label">Ablation Runs</text>
  <text x="400" y="310" class="sans value">72 planned</text>

  <rect x="636" y="220" width="230" height="118" rx="8" fill="#dbe8ea"/>
  <text x="662" y="262" class="sans label">Bench Metrics</text>
  <text x="662" y="310" class="sans value">8 tracked</text>

  <rect x="898" y="220" width="230" height="118" rx="8" fill="#eadbd1"/>
  <text x="924" y="262" class="sans label">DPO Objective</text>
  <text x="924" y="310" class="sans value">pairwise</text>

  <line x1="118" y1="574" x2="1130" y2="574" class="axis"/>
  <line x1="118" y1="402" x2="118" y2="574" class="axis"/>
  <polyline points="120,552 230,520 340,492 450,464 560,438 670,421 780,430 890,404 1000,386 1120,372" class="line"/>
  <text x="122" y="628" class="mono small">accuracy | macro_f1 | ece | brier | invalid_label | hallucination_proxy | latency | lift</text>
</svg>
