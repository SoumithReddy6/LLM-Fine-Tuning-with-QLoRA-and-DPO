experiment_name: mistral_7b_qlora_rank16_financial_sentiment_optional
task: financial_sentiment
stage: sft
model:
  name_or_path: mistralai/Mistral-7B-Instruct-v0.3
  trust_remote_code: false
dataset:
  source: SALT-NLP/FLUE-FiQA
  text_field: sentence
  label_field: label
  max_train_samples: 8000
  max_eval_samples: 1000
training:
  output_dir: outputs/mistral_7b_qlora_rank16
  num_train_epochs: 2
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  warmup_ratio: 0.03
  max_seq_length: 1024
  logging_steps: 10
  save_steps: 250
  eval_steps: 250
  bf16: true
qlora:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
tracking:
  mlflow_experiment: qlora-dpo-financial-sentiment
  wandb_project: qlora-dpo-financial-sentiment
